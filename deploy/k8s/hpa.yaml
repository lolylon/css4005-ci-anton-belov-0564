apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: campus-app
  namespace: campus-app
  labels:
    project: ci-anton-belov-0564
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: campus-app
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Variant: hpa_cpu_target = 60
          averageUtilization: 60
