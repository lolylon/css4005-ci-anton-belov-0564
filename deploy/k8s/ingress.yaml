apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: campus-app
  namespace: campus-app
  labels:
    app: campus-app
    project: ci-anton-belov-0564
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: campus-app
                port:
                  number: 80
