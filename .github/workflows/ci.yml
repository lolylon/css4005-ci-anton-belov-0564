name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  RESOURCE_PREFIX: ci-anton-belov-0564

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - name: Password policy CI check (variant ≥14 + symbol)
        run: |
          python - <<'PY'
          from app.security import check_password
          assert check_password("Short1!", min_length=14)["rules"]["min_length"] is False
          assert check_password("LongEnoughPass1", min_length=14)["rules"]["has_symbol"] is False
          assert check_password("LongEnoughPass1!", min_length=14)["ok"] is True
          print("password policy OK")
          PY

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - name: IaC scan (Trivy config)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: CRITICAL,HIGH
          exit-code: "1"

  build-scan:
    needs: [test, gitleaks]
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build image
        run: docker build -t campus-app:${{ steps.meta.outputs.sha }} .
      - name: Trivy image scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: campus-app:${{ steps.meta.outputs.sha }}
          severity: CRITICAL
          exit-code: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: image-tag
          path: .git/HEAD
          retention-days: 1
        # tag is also in job output; artifact keeps workflow compatible

  push-deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build-scan, terraform]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require AWS_ROLE_ARN secret
        env:
          ROLE: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "Set GitHub secret AWS_ROLE_ARN to the Terraform gha role ARN to enable deploy."
            echo "Skipping push/deploy for this run."
            echo "skip=true" >> "$GITHUB_ENV"
          else
            echo "skip=false" >> "$GITHUB_ENV"
          fi
      - name: Configure AWS (OIDC)
        if: env.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        if: env.skip != 'true'
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build, tag, push
        if: env.skip != 'true'
        env:
          SHA: ${{ needs.build-scan.outputs.image_tag }}
        run: |
          docker build -t campus-app:$SHA .
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REPO="$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/$RESOURCE_PREFIX-campus-app"
          docker tag campus-app:$SHA "$REPO:$SHA"
          docker push "$REPO:$SHA"
      - name: Deploy to k3s
        if: env.skip != 'true'
        env:
          IMAGE_TAG: ${{ needs.build-scan.outputs.image_tag }}
          RESOURCE_PREFIX: ${{ env.RESOURCE_PREFIX }}
        run: |
          chmod +x scripts/deploy-app.sh scripts/bootstrap-state.sh
          cd terraform
          terraform init -input=false
          cd ..
          ./scripts/deploy-app.sh
      - name: Rollback hint on failure
        if: failure() && env.skip != 'true'
        run: echo "Rollback: kubectl -n campus-app rollout undo deployment/campus-app"
